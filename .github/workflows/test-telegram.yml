name: Test Telegram Alert

on:
  workflow_dispatch:

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send test Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BOT_TOKEN="$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')"
          CHAT_ID="$(printf '%s' "$CHAT_ID" | tr -d '[:space:]')"

          if ! printf '%s' "$BOT_TOKEN" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]+$'; then
            echo "ERROR: TELEGRAM_BOT_TOKEN has an invalid format."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is empty."
            exit 1
          fi

          curl --fail-with-body -sS \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🟢 Amul Rose Lassi test successful!"
